name: Post short to Instagram

on:
  schedule:
    - cron: '47 7 * * *'    # 13:17 IST daily (off the busy :00/:30 marks)
    - cron: '29 8 * * *'    # 13:59 IST backup if GitHub skipped the first
  workflow_dispatch:
    inputs:
      episode:
        description: 'Short id (e.g. SH02). Empty = next unposted'
        required: false
        default: ''
      trial:
        description: 'Post as trial reel (non-followers first)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: post-reel

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Post
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SKIP_IF_POSTED_WITHIN_H: ${{ github.event_name == 'schedule' && '12' || '' }}
          QUEUE: publish/shorts_queue.json
          EPISODE: ${{ github.event.inputs.episode }}
          TRIAL: ${{ github.event.inputs.trial == 'true' && '1' || '0' }}   # normal reel (grid + followers); trial only if asked
        run: python3 publish/post_reel.py
      - name: Save queue status
        if: always()
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add publish/shorts_queue.json
          git diff --cached --quiet || (git commit -m "Mark short posted" && git pull --rebase origin main && git push)
