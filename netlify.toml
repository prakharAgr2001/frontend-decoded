# Netlify: static notes site, no backend, no build step (site/ is generated in the repo by publish.build_site)
[build]
  publish = "site"
  command = "echo 'static site, prebuilt in site/'"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# old GitHub-Pages style paths and uppercase ids -> episode pages
[[redirects]]
  from = "/S:season/*"
  to = "/s:season/:splat"
  status = 301
