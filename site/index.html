const D=[{"id": "S1E01", "s": 1, "e": 1, "title": "URL to pixels", "season": "How the browser really works", "text": "5 journeys: DNS (name → IP) → TCP (connection) → TLS (encrypt + verify) → HTTP (request) → render (HTML → pixels). See it: DevTools → Network → first request → Timing (DNS Lookup, Initial connection, SSL, Waiting, Content Download). Trap: DNS isn't done every visit — browser, OS and resolver cache it. First load is usually slowest.", "deep": true}, {"id": "S1E02", "s": 1, "e": 2, "title": "DNS", "season": "How the browser really works", "text": "Phonebook of the internet: domain → IP address. Resolver walks root → TLD (.com) → authoritative name servers. Answers carry a TTL ; cached until it expires. Try: nslookup google.com . Trap: after a server move some users hit the old IP until TTL expires → lower TTL before migrating.", "deep": true}, {"id": "S1E03", "s": 1, "e": 3, "title": "TCP handshake", "season": "How the browser really works", "text": "SYN → SYN-ACK → ACK = 1 round trip before any data (e.g. ~200 ms India ↔ US). Keep-alive reuses connections; later requests show 0 ms \"Initial connection\". Trap: TCP guarantees order, so one lost packet blocks everything behind it (head-of-line blocking) → why HTTP/3 exists.", "deep": true}, {"id": "S1E04", "s": 1, "e": 4, "title": "HTTPS & the padlock", "season": "How the browser really works", "text": "HTTPS = HTTP over TLS. 3 promises: encryption, integrity, authentication . Certificate chain: root CA (trusted by browser) → intermediate → site. TLS 1.3 handshake = 1 round trip (TLS 1.2 = 2). Trap: padlock = private connection, not a safe site. Phishing sites have valid certs.", "deep": true}, {"id": "S1E05", "s": 1, "e": 5, "title": "HTTP/1.1 vs 2 vs 3", "season": "How the browser really works", "text": "1.1: one request per connection at a time → ~6 connections per site. 2: multiplexing + header compression on ONE TCP connection — but a lost packet stalls all streams. 3: QUIC over UDP, independent streams, survives Wi-Fi → mobile switches. Trap: HTTP/2 isn't always faster on lossy networks.", "deep": true}, {"id": "S1E06", "s": 1, "e": 6, "title": "CDNs", "season": "How the browser really works", "text": "Copies of files on edge servers near users; hit = fast, miss = fetch once from origin then cache. Headers: x-cache , cf-cache-status , age . Trap: users see old assets after deploy → versioned (hashed) file names + purge.", "deep": true}, {"id": "S1E08", "s": 1, "e": 8, "title": "DOM & CSSOM", "season": "How the browser really works", "text": "HTML → DOM tree; CSS → CSSOM tree. CSS blocks rendering; classic <script> blocks parsing. View Source = what arrived; Elements = live DOM. Trap: DOM ≠ HTML (browser fixes markup, JS mutates it).", "deep": true}, {"id": "S1E09", "s": 1, "e": 9, "title": "Layout → Paint → Composite", "season": "How the browser really works", "text": "Render tree (visible nodes) → Layout (size/position) → Paint (pixels) → Composite (GPU stacks layers). Performance panel: purple = layout, green = paint. Q: display:none removes from render tree (no space); visibility:hidden keeps the space.", "deep": true}, {"id": "S1E10", "s": 1, "e": 10, "title": "Reflow vs repaint", "season": "How the browser really works", "text": "Geometry (width/height/top) → layout + paint + composite. Color → paint + composite. transform/opacity → composite only. Reflow spreads to siblings/parents. DevTools → Rendering → Paint flashing. Trap: reading offsetHeight right after a style write forces synchronous layout.", "deep": true}, {"id": "S1E11", "s": 1, "e": 11, "title": "Layout thrashing", "season": "How the browser really works", "text": "Read/write/read/write in a loop → a layout per read. Fix: batch all reads, then all writes; schedule writes in requestAnimationFrame . Shows as \"Forced reflow is a likely performance bottleneck\" in Performance. Q: layout-forcing reads: offsetHeight/Top, clientWidth, scrollTop, getBoundingClientRect().", "deep": true}, {"id": "S1E12", "s": 1, "e": 12, "title": "Smooth animation", "season": "How the browser really works", "text": "Animate transform / opacity (compositor, GPU layer) not left/top/width (layout every frame). will-change: transform hints a layer — each layer costs GPU memory, don't overuse. Check: Rendering → Frame Rendering Stats.", "deep": true}, {"id": "S1E14", "s": 1, "e": 14, "title": "One-chef kitchen", "season": "How the browser really works", "text": "JS runs on one main thread that also does style, layout, paint. A 3 s loop freezes everything. Waiting (timers, fetch, events) happens in browser Web APIs; results come back through queues. Trap: setTimeout(fn, 0) = \"as soon as possible\", not \"now\".", "deep": true}, {"id": "S1E15", "s": 1, "e": 15, "title": "Call stack & task queue", "season": "How the browser really works", "text": "log A; setTimeout(log B, 0); log C → A, C, B. Stack runs sync code; Web APIs hold timers; callbacks wait in the task queue; event loop moves a task when the stack is empty. Q: no true 0 ms — deeply nested timers clamp to ≥ 4 ms.", "deep": true}, {"id": "S1E16", "s": 1, "e": 16, "title": "Microtasks vs tasks", "season": "How the browser really works", "text": "Tasks: timers, events. Microtasks: promise callbacks, queueMicrotask . After each task the loop drains ALL microtasks (incl. new ones), then may render, then next task. 1,timeout 2,promise 3,4 → 1 4 3 2. Trap: microtask starvation freezes the page.", "deep": true}, {"id": "S1E17", "s": 1, "e": 17, "title": "16 ms frame budget", "season": "How the browser really works", "text": "60 Hz ≈ 16.7 ms per frame (120 Hz ≈ 8.3 ms). Keep your JS ≲ 10 ms. requestAnimationFrame runs right before paint, once per frame, pauses in background tabs. Use its timestamp (time-based motion). setInterval drifts against frames.", "deep": true}, {"id": "S1E18", "s": 1, "e": 18, "title": "Long tasks", "season": "How the browser really works", "text": "50 ms = long task; blocks input. 100 ms feels instant (50 task + 50 input/paint). Fix: chunk work and yield ( await scheduler.yield() or setTimeout ). Metric: INP (Interaction to Next Paint), Core Web Vital since 2024 (replaced FID).", "deep": true}, {"id": "S1E20", "s": 1, "e": 20, "title": "Bubbling & capturing", "season": "How the browser really works", "text": "Phases: capture ↓ → target → bubble ↑. Listeners default to bubble; { capture: true } for capture. stopPropagation (stop the journey) ≠ preventDefault (stop default action). target = clicked element, currentTarget = element whose listener runs. focus/blur/mouseenter/mouseleave don't bubble.", "deep": true}, {"id": "S1E21", "s": 1, "e": 21, "title": "Event delegation", "season": "How the browser really works", "text": "One listener on the parent + e.target.closest('.row') . Fewer listeners, works for rows added later, no listener leaks. DevTools → Event Listeners → Ancestors. Trap: needs bubbling events; a child's stopPropagation hides it.", "deep": true}, {"id": "S1E22", "s": 1, "e": 22, "title": "Memory leaks", "season": "How the browser really works", "text": "GC frees what's unreachable from roots; a leak is unneeded but still reachable memory. Suspects: listeners not removed, intervals after unmount, ever-growing caches, detached DOM nodes. Use useEffect cleanup, WeakMap. Memory panel: compare heap snapshots, filter \"Detached\". Closures keep captured variables alive.", "deep": true}, {"id": "S1E23", "s": 1, "e": 23, "title": "Observers", "season": "How the browser really works", "text": "IntersectionObserver (lazy load, infinite scroll, autoplay, impressions), ResizeObserver, MutationObserver, PerformanceObserver. Better than scroll listeners: browser computes intersections, no forced layout in your code, fires only on threshold crossings.", "deep": true}, {"id": "S2E01", "s": 2, "e": 1, "title": "White screen first", "season": "Rendering strategies", "text": "Every strategy answers one question: who builds the HTML, and when? Server (before sending) or browser (after arriving). Server-rendered: HTML has content → paint now, JS later. Client-rendered: empty HTML → download JS → run → fetch → paint. See it: DevTools → Performance → ✓ Screenshots, Network = Slow 4G → reload → filmstrip. Trap: a white screen isn't always the network. Big bundles take seconds to parse/run on cheap CPUs → throttle CPU (4x) too.", "deep": true}, {"id": "S2E02", "s": 2, "e": 2, "title": "Client-side rendering (CSR)", "season": "Rendering strategies", "text": "Server sends <div id=\"root\"><\/div> + a bundle; JS builds the DOM in the browser. View Source = what the server sent (empty). Elements = live DOM after JS (full). static hosting, instant after first load. − slow first paint, crawlers/previews without JS see nothing. Trap: Google can render JS (sometimes deferred), but WhatsApp/LinkedIn link previews read raw HTML → blank preview.", "deep": true}, {"id": "S2E03", "s": 2, "e": 3, "title": "Client-side routing", "season": "Rendering strategies", "text": "JS intercepts link clicks, history.pushState() updates the URL, fetches data, swaps part of the page. popstate = Back button. See it: YouTube → Network → Doc filter: no new document on video click; Fetch/XHR shows JSON ( next?… , player?… ). Trap: refreshing /products/42 → 404, because the server only has index.html . Fix: rewrite all routes to index.html ( try_files $uri /index.html; ).", "deep": true}, {"id": "S2E04", "s": 2, "e": 4, "title": "Server-side rendering (SSR)", "season": "Rendering strategies", "text": "Every request: server fetches data + builds full HTML → browser paints immediately; JS loads after to make it interactive. TTFB goes up (server is cooking), first paint comes sooner. See it: View Source on Amazon shows titles/prices; Network → document → Timing → \"Waiting for server response\" ≈ render time. Trap: SSR isn't always faster — slow DB or far server = huge TTFB, and still not interactive until JS. SSR moves work, doesn't delete it.", "deep": true}, {"id": "S2E05", "s": 2, "e": 5, "title": "Static site generation (SSG)", "season": "Rendering strategies", "text": "HTML built once at build time , copied to CDN edges, served as-is. Great for docs, blogs, marketing. Headers: cache HIT, large age → built long before you asked. Trap: 50k products + hourly prices → slow builds + stale until next deploy. Not on its own.", "deep": true}, {"id": "S2E06", "s": 2, "e": 6, "title": "Incremental static regeneration (ISR)", "season": "Rendering strategies", "text": "Static page + expiry. After it expires, the next visitor still gets the old page; a rebuild of that page runs in the background. Next.js: export const revalidate = 60; · on-demand: revalidatePath('/product/42') . Same idea in HTTP: Cache-Control: s-maxage=60, stale-while-revalidate . Trap: the first visitor after expiry still sees the OLD page; pages nobody visits stay stale.", "deep": true}, {"id": "S2E08", "s": 2, "e": 8, "title": "Hydration", "season": "Rendering strategies", "text": "Server HTML = a picture. Hydration = React re-runs components in the browser and attaches handlers to the existing DOM. renderToString(<App />) on the server · hydrateRoot(root, <App />) in the browser. Runs on the main thread → one long task; taps wait. Trap: it does NOT rebuild the DOM, but it DOES run every component again → CPU cost.", "deep": true}, {"id": "S2E09", "s": 2, "e": 9, "title": "Hydration mismatch", "season": "Rendering strategies", "text": "Rule: server HTML must equal the browser's first render. Causes: Date , Math.random() , window / localStorage in render, timezone/locale, invalid nesting ( <div> in <p> ), extensions. Fix: same placeholder on both sides → fill browser-only values in useEffect . Tiny diffs: suppressHydrationWarning . Trap: typeof window checks in render CAUSE mismatches.", "deep": true}, {"id": "S2E10", "s": 2, "e": 10, "title": "Visible but not clickable", "season": "Rendering strategies", "text": "The uncanny valley: visible (FCP) but not interactive (JS loading/hydrating). FCP = first see something · TTI = reliably responds · TBT = blocked time in between. Field: INP. See it: Performance, CPU 4x slowdown → gap between first content screenshot and end of long tasks. Trap: green Lighthouse (one lab device) ≠ real users on cheap phones → check field INP.", "deep": true}, {"id": "S2E11", "s": 2, "e": 11, "title": "Selective hydration", "season": "Rendering strategies", "text": "Classic hydration is all-or-nothing. React 18 hydrates each <Suspense> boundary independently, yielding between chunks. Clicking an un-hydrated part → React hydrates it first, then replays the click. Trap: it doesn't make JS smaller — same code downloads and runs; only order + chunking change.", "deep": true}, {"id": "S2E13", "s": 2, "e": 13, "title": "Streaming SSR", "season": "Rendering strategies", "text": "Send the shell + fallbacks first; stream the slow parts later with a tiny script that swaps them in. React: renderToPipeableStream(<App />, { onShellReady() { stream.pipe(res) } }) . Works because HTTP bodies arrive in pieces (chunked in 1.1, DATA frames in 2/3). See it: Timing → long \"Content Download\"; View Source → <div hidden id=\"S:0\"> + $RC(...) scripts. Trap: once the first chunk is out, status/headers are sent → no 404/redirect later. Decide before the shell.", "deep": true}, {"id": "S2E14", "s": 2, "e": 14, "title": "React Server Components (RSC)", "season": "Rendering strategies", "text": "Run only on the server; can be async and read the DB; their code never ships. Only output (RSC payload) does. Interactive parts = 'use client' components; only those ship JS. See it: nextjs.org → Network → ?_rsc= requests on navigation. RSC ≠ SSR: SSR = HTML for first load, then everything hydrates. RSC never hydrates, refetchable on navigation. Frameworks use both. Trap: no useState / onClick in server components → pass data as props to a client component.", "deep": true}, {"id": "S2E15", "s": 2, "e": 15, "title": "Server Actions", "season": "Rendering strategies", "text": "'use server' function called like a normal function → React sends a POST ( Next-Action: <id> header). Works with <form action={fn}> even before JS loads (progressive enhancement). Trap: it's a PUBLIC POST endpoint. Always check auth and validate inputs inside the action.", "deep": true}, {"id": "S2E16", "s": 2, "e": 16, "title": "Islands architecture", "season": "Rendering strategies", "text": "Static HTML by default; only interactive widgets hydrate, each independently ( <astro-island> in Elements). Astro: client:load , client:visible (IntersectionObserver), client:idle . Trap: islands are separate apps → props can't cross. Share via a store (nanostores), custom events, or rethink boundaries.", "deep": true}, {"id": "S2E17", "s": 2, "e": 17, "title": "Resumability", "season": "Rendering strategies", "text": "Qwik: server serializes state + event wiring into HTML; browser resumes without re-running components. Handlers are URLs to small chunks ( on:click=\"q-…js#s_…\" ); one tiny global listener loads code on interaction. Trap: first interaction must fetch code → slow on bad networks; mitigate by prefetching likely handlers.", "deep": true}, {"id": "S2E18", "s": 2, "e": 18, "title": "Edge rendering", "season": "Rendering strategies", "text": "Run SSR in many small data centers near users (where CDNs live). Lighter runtimes: no full Node, small memory/CPU limits. Great for personalization, redirects, A/B tests, auth checks. Trap: edge render + single-region DB = every query crosses the planet. Only helps when data is close or cached.", "deep": true}, {"id": "S2E19", "s": 2, "e": 19, "title": "Case study: an online store", "season": "Rendering strategies", "text": "3 questions per page: SEO? Same for everyone? How often does data change? /blog SSG · / ISR · /product/:id ISR + client islands (price/stock/cart) · /search streaming SSR · cart/checkout/account CSR. Trap: one strategy for the whole app. Choose per route, even per component.", "deep": true}, {"id": "S2E21", "s": 2, "e": 21, "title": "Finale", "season": "Rendering strategies", "text": "Blog = SSG (+ ISR, islands). Amazon = SSR (fast paint, then JS makes it interactive). Gmail = CSR + client routing (slow start, instant after). Modern toolbox (streaming, RSC, actions, edge, resumability) = less work on the user's phone without losing interactivity.", "deep": true}, {"id": "S3E01", "s": 3, "e": 1, "title": "100 ms = money", "season": "Web performance", "text": "Google research: 53% of mobile visits are abandoned if a page takes > 3 s. Often-quoted Amazon finding: +100 ms ≈ −1% sales. Response-time limits (Nielsen): 0.1 s feels instant · 1 s keeps flow · 10 s loses attention. Two jobs: be fast (send less, do less on the main thread) and feel fast (useful content early, instant feedback). Try: DevTools → Network → throttling \"Slow 4G\" → reload. Trap: averages hide slow users → report p75 .", "deep": true}, {"id": "S3E02", "s": 3, "e": 2, "title": "Core Web Vitals", "season": "Web performance", "text": "LCP (loading) ≤ 2.5 s · INP (responsiveness) ≤ 200 ms · CLS (visual stability) ≤ 0.1. Graded at the 75th percentile of real Chrome visits (CrUX), mobile and desktop separately. See it: PageSpeed Insights → \"Discover what your real users are experiencing\". Trap: INP replaced FID in March 2024.", "deep": true}, {"id": "S3E03", "s": 3, "e": 3, "title": "LCP", "season": "Web performance", "text": "Time until the largest image / text block in the viewport renders. Candidates: <img> , video poster, CSS background image, text blocks. 4 parts: TTFB → resource load delay → load duration → render delay. Usually the delay (image found late) is the problem. See it: Performance panel → LCP marker + LCP breakdown insight. Trap: loading=\"lazy\" on the hero makes LCP worse.", "deep": true}, {"id": "S3E04", "s": 3, "e": 4, "title": "CLS", "season": "Web performance", "text": "Sum of unexpected shifts; each = impact × distance; grouped into bursts (session windows); your worst burst = CLS. Culprits: images without width/height, ads/embeds without reserved space, injected banners, font swaps. Fix: reserve space ( width/height , aspect-ratio , min-height ). See it: Rendering → Layout Shift Regions. Trap: shifts within 500 ms of a tap/keypress are excluded; transform animations never shift layout.", "deep": true}, {"id": "S3E05", "s": 3, "e": 5, "title": "INP", "season": "Web performance", "text": "Input → next paint. Parts: input delay (main thread busy) + processing (handlers) + presentation delay (style/layout/paint). Roughly your worst interaction of the visit, not an average. Fix: feedback first, await scheduler.yield() , heavy work after; break long tasks. See it: Performance panel live metrics → interactions list. Trap: scroll and hover are not counted — only click, tap, key press.", "deep": true}, {"id": "S3E06", "s": 3, "e": 6, "title": "TTFB · FCP · TBT", "season": "Web performance", "text": "TTFB (first byte, good ≤ 0.8 s) → FCP (first anything, ≤ 1.8 s) → LCP. Slow TTFB = server, distance, redirects → CDN, caching. TBT = sum over long tasks of (duration − 50 ms) between FCP and interactive. Lab stand-in for INP; Lighthouse weight 30% (largest). Puzzle: tasks 70, 140, 40 ms → TBT = 20 + 90 + 0 = 110 ms .", "deep": true}, {"id": "S3E07", "s": 3, "e": 7, "title": "Lab vs field", "season": "Web performance", "text": "Lab (Lighthouse): one run, simulated mid-range phone, throttled, clean browser → repeatable, for debugging. Field (CrUX / RUM): real users, 28 days, p75. They disagree: lab has no INP, only first screen, one device. RUM: import { onLCP, onINP, onCLS } from 'web-vitals' + navigator.sendBeacon . Trap: CrUX is a 28-day rolling window → fixes fade in over weeks.", "deep": true}, {"id": "S3E08", "s": 3, "e": 8, "title": "IQ: measuring performance", "season": "Web performance", "text": "CWV + thresholds at p75 · Lighthouse 98 but poor INP (no interactions, TBT is a proxy, real devices, 28 days) · slow LCP with fast image download (TTFB, load delay → in HTML + preload/fetchpriority, render delay) · banner CLS (reserve, overlay, transform).", "deep": true}, {"id": "S3E09", "s": 3, "e": 9, "title": "Critical rendering path", "season": "Web performance", "text": "HTML → DOM, CSS → CSSOM → render tree → first pixels. CSS is render-blocking ; plain <script> is parser-blocking . Shrink it: inline critical CSS, load the rest non-blocking, media=\"print\" for non-critical sheets, defer scripts. See it: Lighthouse \"Render blocking requests\"; Performance panel request details \"Render blocking\". Trap: a script after a stylesheet waits for that CSS → CSS can block parsing too.", "deep": true}, {"id": "S3E10", "s": 3, "e": 10, "title": "async vs defer", "season": "Web performance", "text": "plain: stop parsing, fetch, run. async : fetch in parallel, run on arrival, no order. defer : fetch in parallel, run after parsing, in document order, before DOMContentLoaded. defer → app code; async → independent scripts (analytics). type=\"module\" is deferred by default. Trap: async scripts that depend on each other break randomly; defer does nothing on inline scripts.", "deep": true}, {"id": "S3E11", "s": 3, "e": 11, "title": "Resource hints", "season": "Web performance", "text": "preconnect (DNS+TCP+TLS early) · dns-prefetch (DNS only) · preload (this page, late-discovered, high priority, needs as ) · prefetch (next page, lowest priority). See it: Network → Priority column. Trap: preloading everything steals bandwidth; Chrome warns about unused preloads; font preload needs crossorigin or it downloads twice.", "deep": true}, {"id": "S3E12", "s": 3, "e": 12, "title": "Code splitting", "season": "Web performance", "text": "Dynamic import() → separate chunk loaded on demand. Split by route, heavy feature, below the fold; shared libs in a vendor chunk. See it: DevTools → Coverage (red = downloaded, never ran). Trap: too many tiny chunks → request waterfalls.", "deep": true}, {"id": "S3E13", "s": 3, "e": 13, "title": "Lazy routes", "season": "Web performance", "text": "const Orders = lazy(() => import('./pages/Orders')) inside <Suspense fallback> . Hide the delay: prefetch on hover / in viewport (Next.js <Link> does this in production). Rules: never lazy-load the landing route; fallbacks must hold layout. Trap: after a deploy, old tabs hit ChunkLoadError → keep old chunks, catch + reload.", "deep": true}, {"id": "S3E14", "s": 3, "e": 14, "title": "Tree shaking", "season": "Web performance", "text": "Bundler follows imports from the entry, keeps used exports, drops the rest. Needs ES modules (static); CommonJS require usually can't be shaken. Side effects: mark \"sideEffects\": false (or a list) in package.json. import _ from 'lodash' ≈ 70 KB vs import { debounce } from 'lodash-es' . Trap: barrel files ( export * from … ) can pull whole libraries in → import from the file directly.", "deep": true}, {"id": "S3E15", "s": 3, "e": 15, "title": "Bundle diet", "season": "Web performance", "text": "100 KB of JS ≠ 100 KB of image: JS is downloaded, parsed, compiled and executed on the main thread. Measure (bundle analyzer), then: moment → date-fns / Intl, drop unneeded polyfills, dedupe versions, check bundlephobia, use the platform (fetch, <dialog> ). Trap: \"200 KB gzipped\" — the browser parses the uncompressed size (~700 KB). Compression saves network, not CPU.", "deep": true}, {"id": "S3E16", "s": 3, "e": 16, "title": "Minify + Brotli", "season": "Web performance", "text": "Minify: strip whitespace/comments, rename locals. Compress: gzip, Brotli (≈ 15–20% smaller than gzip on text). accept-encoding: gzip, deflate, br, zstd → content-encoding: br . See it: Network → big request rows show transferred vs real size. Trap: don't compress JPEG/PNG/MP4/WOFF2 — already compressed. Compress text: HTML, CSS, JS, JSON, SVG.", "deep": true}, {"id": "S3E17", "s": 3, "e": 17, "title": "IQ: loading + bundles", "season": "Web performance", "text": "When scripts run (plain/async/defer/module) · preconnect vs preload vs prefetch · why tree shaking keeps code (CJS, side effects, barrels, dynamic access) · cutting a 1.5 MB bundle (measure → split → replace → minify + Brotli → budget).", "deep": true}, {"id": "S3E18", "s": 3, "e": 18, "title": "Responsive images", "season": "Web performance", "text": "srcset (files + w widths) + sizes (display width) → browser picks the smallest sharp file, including DPR. <picture> for AVIF/WebP + JPEG fallback and art direction ( media ). See it: Elements → hover <img> : rendered vs intrinsic size; Lighthouse \"Properly size images\". Trap: no sizes → assumes 100vw → biggest file.", "deep": true}, {"id": "S3E19", "s": 3, "e": 19, "title": "LCP image priority", "season": "Web performance", "text": "Images start Low and are boosted only after layout. fetchpriority=\"high\" on the hero (Chrome team test on Google Flights: LCP 2.6 s → 1.9 s). Must be discoverable by the preload scanner: plain <img> in HTML, or <link rel=\"preload\" as=\"image\" fetchpriority=\"high\"> . Never lazy, don't wait for client JS. Trap: high priority on everything = nothing is high priority.", "deep": true}, {"id": "S3E20", "s": 3, "e": 20, "title": "Web fonts", "season": "Web performance", "text": "FOIT (invisible text while loading) vs FOUT (fallback, then swap). font-display : block · swap · optional. Swap can cause CLS → matched fallback with size-adjust , ascent-override . Arrive sooner: self-host, preload 1–2 files, woff2, subset. IQ: safest for CWV is often optional (no invisible text, no late shift) — trade-off: slow first visits may never show the brand font.", "deep": true}, {"id": "S3E21", "s": 3, "e": 21, "title": "Third-party cost", "season": "Web performance", "text": "Third-party JS runs on your main thread: long tasks (INP), late banners (CLS), extra origins (connections). Measure: DevTools request blocking → compare. Tame: facades, delay until interaction, self-host, Partytown (web worker). See it: Performance \"3rd parties\" insight. Trap: async only avoids parser blocking; the script still runs on the main thread.", "deep": true}, {"id": "S3E22", "s": 3, "e": 22, "title": "IQ: images, fonts, third parties", "season": "Web performance", "text": "Why sizes · slow hero LCP checklist (HTML, fetchpriority/preload, not lazy, right size/format/CDN) · no FOIT + no font CLS · adding a chat widget safely (measure, facade, after interaction, reserve space).", "deep": true}, {"id": "S3E23", "s": 3, "e": 23, "title": "Debounce", "season": "Web performance", "text": "Run once after the user stops (e.g. 300 ms of quiet). Search boxes, autosave, resize. clearTimeout(timer); timer = setTimeout(() => fn(...args), wait); Trap: debounce doesn't fix race conditions → AbortController or ignore stale responses.", "deep": true}, {"id": "S3E24", "s": 3, "e": 24, "title": "Throttle", "season": "Web performance", "text": "At most once per interval, steadily during the storm (scroll progress, drag). Debounce = after silence; throttle = regular. Better for visuals: requestAnimationFrame ; for visibility: IntersectionObserver . Trap: naive throttle drops the last call → add a trailing call.", "deep": true}, {"id": "S3E25", "s": 3, "e": 25, "title": "Virtualization", "season": "Web performance", "text": "Render only visible rows + overscan; a tall spacer keeps the scrollbar right; rows are recycled. Libraries: TanStack Virtual, react-window. Lighter option: content-visibility: auto + contain-intrinsic-size (stays in DOM). See it: Performance monitor → DOM Nodes stays flat. Trap: Ctrl+F misses unrendered rows, screen readers, unknown heights → jumpy scrollbar.", "deep": true}, {"id": "S3E26", "s": 3, "e": 26, "title": "Web Workers", "season": "Web performance", "text": "JS on another thread; no DOM; talk via postMessage / onmessage . Good for parsing, image processing, search indexes, crypto, diffing. See it: Performance panel shows a separate Worker track. Trap: postMessage copies data (structured clone) → transfer ArrayBuffer s: postMessage(buf, [buf]) .", "deep": true}, {"id": "S3E27", "s": 3, "e": 27, "title": "Why React re-renders", "season": "Web performance", "text": "State change · context change · parent re-render (props changing is not the trigger). Render ≠ DOM update (commit applies only real changes). Fix structurally: move state down, pass components as children. See it: React DevTools \"Highlight updates\" + Profiler \"Why did this render?\". IQ: same value via Object.is → bail out; a new object with the same contents re-renders.", "deep": true}, {"id": "S3E28", "s": 3, "e": 28, "title": "Memo myths", "season": "Web performance", "text": "React.memo (shallow props), useMemo (value), useCallback (function identity). Memo isn't free: storage + comparison every render. Inline objects/arrow functions break memo → stabilize with useMemo/useCallback. Memoize on evidence (Profiler ranked view). Trap: useMemo is a performance hint, never a correctness guarantee — React may discard the cache.", "deep": true}, {"id": "S3E29", "s": 3, "e": 29, "title": "useTransition + React Compiler", "season": "Web performance", "text": "startTransition(() => setFilter(v)) marks non-urgent updates; renders are interruptible; isPending for subtle feedback. useDeferredValue when you don't own the setter. React Compiler (v1.0, late 2025) auto-memoizes at build time; DevTools shows a \"Memo\" badge. Trap: transitions don't make work faster, only interruptible → still virtualize / do less.", "deep": true}, {"id": "S3E30", "s": 3, "e": 30, "title": "Chunking long tasks", "season": "Web performance", "text": "Slice by time (~10 ms), not item count; await scheduler.yield() continues near the front of the queue (setTimeout goes to the back). scheduler.postTask(fn, { priority: 'user-blocking' | 'user-visible' | 'background' }) . See it: many small tasks with gaps instead of one red-cornered block. Trap: await Promise.resolve() is a microtask — it does not yield to rendering or input.", "deep": true}, {"id": "S3E31", "s": 3, "e": 31, "title": "Performance budgets", "season": "Web performance", "text": "Agreed limits, e.g. JS ≤ 170 KB compressed, LCP ≤ 2.5 s, TBT ≤ 200 ms. Kinds: quantity, milestone timings, rule-based scores. Enforce in CI: Lighthouse CI assertions, size-limit → fail the PR. IQ: start from current field data, set slightly better, ratchet down, test on a real mid-range phone.", "deep": true}, {"id": "S3E32", "s": 3, "e": 32, "title": "IQ: runtime", "season": "Web performance", "text": "Debounce vs throttle (+ rAF, IntersectionObserver) · 10k-row table (virtualize, content-visibility, paginate, trade-offs) · re-renders (causes, move state down, memo where measured, Compiler) · 400 ms click handler (feedback + yield, chunk, worker, transition).", "deep": true}, {"id": "S3E33", "s": 3, "e": 33, "title": "Finale: one product page, made fast", "season": "Web performance", "text": "Measure (CWV, field vs lab) → loading (CDN TTFB, critical CSS, defer, preconnect) → bundle (split, lazy, diet, Brotli) → hero (AVIF srcset, fetchpriority) → shifts (reserve space, font fallback) → third parties (facade, delay) → interactions (feedback first, transition, virtualize, worker, chunking) → budget in CI.", "deep": true}, {"id": "S4E01", "s": 4, "e": 1, "title": "What is state", "season": "State management", "text": "State = data your UI remembers right now that can change while the page is open. Rule: if it changes and the screen must show it, it's state. React's idea: UI = f(state) . Don't edit the screen; change state ( setX ) and React re-renders, touching only what differs in the DOM. Trap: don't store what you can compute. const total = items.reduce(...) , not useState(total) → two sources of truth drift. See it: React DevTools → Components → select a component → hooks panel shows live state.", "deep": true}, {"id": "S4E02", "s": 4, "e": 2, "title": "The 5 types of state", "season": "State management", "text": "Type Examples Home Local UI isOpen, activeTab, hovered useState Shared client cart, theme, user context / store Server menu, prices, orders server cache (React Query, SWR, RTK Query) URL ?q= , filters, page the address bar Form values, touched, errors form library 3 questions: from the server? → cache. Survive refresh/share? → URL. Distant components? → context/store. Otherwise local. Classic mistake: server data copied into a global store = hand-written loading flags, refetching, cache rules.", "deep": true}, {"id": "S4E03", "s": 4, "e": 3, "title": "Colocation", "season": "State management", "text": "Keep state as close as possible to where it's used — and no higher. Lift only to the closest common parent . State at the top → every update re-renders from the top (S3·E27). Move it down, or pass heavy parts as children . Bonus: delete a component and its state goes too. Global only for truly app-wide values (user, theme, locale) — and even then, not one giant object.", "deep": true}, {"id": "S4E04", "s": 4, "e": 4, "title": "The context trap", "season": "State management", "text": "useContext subscribes to the whole value. Any change → every consumer re-renders. Trap 1: value={{ user, cart }} is a new object every render → useMemo it. Trap 2: one big context → split by concern (UserCtx, ThemeCtx, CartCtx) and split state from dispatch. React.memo does NOT stop context re-renders. Context = delivery, not a state manager; hot state → store with selectors. See it: React Profiler → \"Why did this render? Context changed\".", "deep": true}, {"id": "S4E05", "s": 4, "e": 5, "title": "IQ: state basics", "season": "State management", "text": "Props vs state (passed/read-only vs owned/changes; derive computables; useRef for non-visual) · 5 types + homes · search re-renders page (state too high → move down / children) · context fan-out (memo value, split, separate dispatch, store+selectors; memo won't help).", "deep": true}, {"id": "S4E06", "s": 4, "e": 6, "title": "Redux from scratch", "season": "State management", "text": "3 ideas: one store · actions describe what happened ( { type: 'cart/added', item } ) · reducers are pure (state, action) → newState . createStore ≈ 10 lines: state , subs , getState , subscribe , dispatch (run reducer → save → notify). One-way flow: UI → dispatch → reducer → new state → subscribers re-render. Redux DevTools = action log + time travel. Trap: mutate + return same reference → Object.is(prev, next) true → UI never updates, time travel breaks.", "deep": true}, {"id": "S4E07", "s": 4, "e": 7, "title": "Redux Toolkit", "season": "State management", "text": "Official way today. createSlice generates action types + creators; reducers can \"mutate\" because Immer gives a draft. configureStore : DevTools wired, dev checks for mutation + non-serializable values (Dates, functions). RTK Query = server-state cache inside Redux. Is Redux dead? No — big apps, many writers, logged/replayable changes. Overkill for small apps.", "deep": true}, {"id": "S4E08", "s": 4, "e": 8, "title": "Zustand · Jotai · MobX", "season": "State management", "text": "Zustand : create((set) => ({...})) , no Provider, read slices useCart(s => s.items.length) . Jotai : atoms + derived atoms ( atom(get => ...) ), re-render only on atoms you read. MobX : makeAutoObservable + observer , mutate directly, spreadsheet-style auto updates. Trap: module-level store on the server (SSR) is shared across requests → user data leaks. Create a store per request, pass via context.", "deep": true}, {"id": "S4E09", "s": 4, "e": 9, "title": "Selectors", "season": "State management", "text": "Selector picks the slice a component needs; component re-renders only when the result changes ( === after every dispatch). Trap: filter / map /object literals return new references every time → always re-render. Use createSelector (memoized), separate selectors, or shallowEqual / useShallow . Selectors are where derived data lives (totals, counts, filtered lists).", "deep": true}, {"id": "S4E10", "s": 4, "e": 10, "title": "IQ: Redux & stores", "season": "State management", "text": "Redux flow · why RTK can push (Immer draft → new immutable copy; only in createSlice/createReducer) · context vs Zustand vs Redux (rarely-changing / low boilerplate / big teams; server data → query cache) · filter selector re-renders (new array → memoize/shallow).", "deep": true}, {"id": "S4E11", "s": 4, "e": 11, "title": "Server state", "season": "State management", "text": "Lives on a server, you hold a copy, others can change it → stale on arrival. Async, can fail, shared across users and tabs. Needs: caching, dedupe, refetch when stale, background updates, pagination, garbage collection. useEffect fetch: no cache, duplicate requests, races. Server Components (S2·E14) remove the client copy for read-only data; interactive data still needs a client cache.", "deep": true}, {"id": "S4E12", "s": 4, "e": 12, "title": "React Query", "season": "State management", "text": "useQuery({ queryKey, queryFn }) → data , isPending , error . Key = cache address; same key = one request (dedupe). Stale-while-revalidate: show cache now, refetch in background, swap if changed. staleTime (fresh window, default 0) vs gcTime (unused data kept, default 5 min). Refetch on focus, reconnect, mount-when-stale. Trap: isPending (no data yet → skeleton) vs isFetching (any request incl. background → don't flash a spinner).", "deep": true}, {"id": "S4E13", "s": 4, "e": 13, "title": "Cache invalidation", "season": "State management", "text": "After a mutation: qc.invalidateQueries({ queryKey: ['addresses'] }) → marks matching queries stale, refetches active ones. Keys are folders: prefix match ( ['addresses'] hits ['addresses', 7] ); exact: true for one key. Or setQueryData with the server's response (skip a round trip). Too little = screens lie; too much = refetch the world. Other tabs: refetch on window focus; BroadcastChannel ; server push (S6).", "deep": true}, {"id": "S4E14", "s": 4, "e": 14, "title": "Normalization", "season": "State management", "text": "Store each entity once, keyed by id; everything else references the id: users.byId[7] , posts.byId[101].author = 7 . Wins: one source of truth, updates in one place, O(1) lookups, no deep spreads. Tools: RTK createEntityAdapter ; Apollo/Relay normalize automatically ( __typename + id). React Query caches per query (invalidate instead).", "deep": true}, {"id": "S4E15", "s": 4, "e": 15, "title": "Optimistic UI", "season": "State management", "text": "Update the UI as if success, send the request, fix on failure. Feels instant on slow networks. React Query: onMutate → cancelQueries → setQueryData . React 19: useOptimistic (value lives while the action runs). Use for likes, toggles, reorder, chat. Not for payments, last-item stock, anything where false success costs the user. Trap: cancel in-flight refetches first, or an old response overwrites your optimistic value.", "deep": true}, {"id": "S4E16", "s": 4, "e": 16, "title": "Rollback", "season": "State management", "text": "onMutate : snapshot prev and return it · onError : restore ctx.prev + toast with Retry · onSettled : invalidate (server truth wins). Races: like/unlike/like out of order → stale snapshot. Fix: send intent ( PUT { liked: true } , idempotent) not toggle, serialize per item, always settle with a refetch.", "deep": true}, {"id": "S4E17", "s": 4, "e": 17, "title": "IQ: server state", "season": "State management", "text": "Server vs client state · staleTime vs gcTime · syncing after mutations (invalidate by prefix / setQueryData / focus / BroadcastChannel) · optimistic like with rollback (cancel → snapshot → write → onError restore → onSettled refetch).", "deep": true}, {"id": "S4E18", "s": 4, "e": 18, "title": "URL state", "season": "State management", "text": "If it should be shareable, bookmarkable, or reachable with Back → put it in the URL (path + query). useSearchParams : read from and write to the URL; it's the single source of truth (no useState copy). replace while typing, push for committed choices. Not in the URL: secrets/PII (logs, history, referrers), huge objects, ephemeral UI. Values are strings → parse + validate.", "deep": true}, {"id": "S4E19", "s": 4, "e": 19, "title": "Form state", "season": "State management", "text": "Controlled ( value + onChange , a render per keystroke) vs uncontrolled (DOM holds value, FormData / refs on submit). Form state = values, touched, dirty, errors, isSubmitting. React Hook Form: register (refs), schema resolver (zod), subscribe-only re-renders. Errors: validate on blur/submit first, then on change (\"reward early, punish late\"). React 19: useActionState , <form action> . Trap: input loses focus each keystroke → component defined inside another (new type every render). Define outside, stable keys.", "deep": true}, {"id": "S4E20", "s": 4, "e": 20, "title": "State machines", "season": "State management", "text": "Boolean soup: 3 booleans = 8 combos, ~4 valid. Use one status + explicit transitions. machine = { idle: { SUBMIT: 'submitting' }, submitting: { OK, FAIL }, error: { RETRY } } ; unknown events are ignored. XState for complex flows (nested/parallel states, guards, timers, visual editor). Double payment: machine ignores SUBMIT + disable button + idempotency key.", "deep": true}, {"id": "S4E21", "s": 4, "e": 21, "title": "Immer", "season": "State management", "text": "React compares by reference; mutation = same object = no re-render. Nested spreads are error-prone. produce(state, draft => { draft.user.address.city = 'Pune' }) : Proxy records writes, copy-on-write, structural sharing, frozen in dev. Used in RTK createSlice , useImmer , Zustand immer middleware. Trap: d => d.count = 5 mutates AND returns → throws; use braces.", "deep": true}, {"id": "S4E22", "s": 4, "e": 22, "title": "IQ: URL · forms · machines · Immer", "season": "State management", "text": "What goes in the URL (and what doesn't) · controlled vs uncontrolled (+ focus-loss bug) · isLoading && isError → status machine · how Immer mutates safely.", "deep": true}, {"id": "S4E23", "s": 4, "e": 23, "title": "Finale: one food order", "season": "State management", "text": "URL (search + filters) · local (dropdown) · server cache (menu) · store + selectors (cart, badge, derived total) · context (theme, user) · form library (address) + invalidation · state machine (payment) · normalized orders · optimistic like + rollback · Immer updates.", "deep": true}, {"id": "S5E01", "s": 5, "e": 1, "title": "REST", "season": "Data fetching & APIs", "text": "Everything is a resource with its own URL ( /users/42 , /posts/7/comments ). Act on it with verbs. GET read · POST create · PUT replace whole · PATCH change some fields · DELETE remove. Status: 200 OK · 201 Created · 404 Not Found. fetch does not throw on 404/500 → always check res.ok . Try: open api.github.com/users/torvalds in a tab. Trap: PUT vs POST is about idempotency — 5× PUT = one user, 5× POST = maybe 5 orders.", "deep": false}, {"id": "S5E02", "s": 5, "e": 2, "title": "GraphQL", "season": "Data fetching & APIs", "text": "One endpoint ( POST /graphql ); the query is shaped like the answer; the response mirrors it. A schema defines types + fields. Fixes over-fetching (too much per call) and under-fetching (too many calls). Costs: one URL + POST → no free HTTP/CDN caching; deeply nested queries can be very expensive (add depth/complexity limits). See it: instagram.com → Network → filter graphql . Trap: errors often arrive as 200 OK with an errors array → check it.", "deep": false}, {"id": "S5E03", "s": 5, "e": 3, "title": "REST vs GraphQL vs tRPC", "season": "Data fetching & APIs", "text": "REST: many clients, public APIs, simplest caching. GraphQL: many screens picking their own fields. tRPC: one TypeScript team owns client + server (monorepo), end-to-end types, no schema/codegen. In the wild: GitHub (REST + GraphQL), Shopify Storefront (GraphQL), T3-stack apps (tRPC). Trap: GraphQL is not \"faster\" — fewer round trips, but careless queries are slow and you lose easy caching. Choose by clients + teams.", "deep": false}, {"id": "S5E04", "s": 5, "e": 4, "title": "Backend for Frontend (BFF)", "season": "Data fetching & APIs", "text": "A small server owned by the frontend team: app makes one call ; BFF fans out to services (in parallel, close to them), trims fields, returns screen-shaped data. Usually one BFF per experience (mobile vs web). Bonus: keeps tokens on the server, browser gets an httpOnly cookie. Trap: no business rules (pricing etc.) in the BFF — they get copied per BFF and drift. BFF = shaping only.", "deep": false}, {"id": "S5E05", "s": 5, "e": 5, "title": "IQ: API design", "season": "Data fetching & APIs", "text": "Idempotent: GET, PUT, DELETE (POST no, PATCH not guaranteed) → matters for retries; POST needs an Idempotency-Key . GraphQL N+1 (1 query for posts + 1 per author) → batch with DataLoader . Mobile screen needing 4 services → BFF. When not GraphQL: CDN caching critical, simple CRUD, one TS team (tRPC).", "deep": false}, {"id": "S5E06", "s": 5, "e": 6, "title": "The offset bug", "season": "Data fetching & APIs", "text": "?limit=10&offset=10 → LIMIT 10 OFFSET 10 . New item on top shifts rows → duplicates ; deletes shift up → skipped items. Deep offsets are slow: DB still reads and discards every skipped row. Trap: offset is fine for rarely-changing data and jump-to-page UIs (admin tables, search results). It breaks on fast-changing feeds.", "deep": false}, {"id": "S5E07", "s": 5, "e": 7, "title": "Cursor pagination", "season": "Data fetching & APIs", "text": "\"10 items older than this one\": response has items + opaque nextCursor ; client sends ?after=<cursor> ; null = end. Server: WHERE created_at < :cursor ORDER BY created_at DESC LIMIT 10 — with an index, page 1000 ≈ page 1. See it: reddit.com/r/javascript.json → \"after\": \"t3_…\" . Trap: ties on the sort key skip rows → sort by (created_at, id) and put both in the cursor. Cost: no jump to page 50.", "deep": false}, {"id": "S5E08", "s": 5, "e": 8, "title": "Infinite scroll vs pages", "season": "Data fetching & APIs", "text": "Infinite: great for browsing on phones; footer unreachable, back button loses place, memory grows. Pages: hunting, shareable \"page 3\" URL, crawlable. Middle: Load more . Build: IntersectionObserver on a sentinel with rootMargin: '600px' ; long lists → virtualization (S3E25). Trap: back button → top of feed. Keep loaded pages + scroll position (query cache or URL) and restore; don't refetch from page 1.", "deep": false}, {"id": "S5E09", "s": 5, "e": 9, "title": "IQ: pagination", "season": "Data fetching & APIs", "text": "Duplicates on page 2 = offset + inserts → cursor. Missing items with timestamp cursor = ties → (created_at, id) . Jump to page 50 → offset (cap the depth). Infinite scroll without scroll listeners → IntersectionObserver + rootMargin (+ virtualization).", "deep": false}, {"id": "S5E10", "s": 5, "e": 10, "title": "Waterfalls", "season": "Data fetching & APIs", "text": "Request 2 waits for request 1 → staircase in the Network waterfall; each step costs a round trip (~100–300 ms on mobile). React: parent fetches in an effect → renders child → child fetches = fetch-on-render . Fix: start early (route loader, hoist, prefetch) = fetch-then-render. Trap: true dependency (needs user id) → move the join to the server (one endpoint / BFF) so it happens next to the DB.", "deep": false}, {"id": "S5E11", "s": 5, "e": 11, "title": "Parallel requests", "season": "Data fetching & APIs", "text": "Independent requests: start all, then await Promise.all([...]) → total ≈ slowest, not the sum. HTTP/2 multiplexes; HTTP/1.1 ≈ 6 connections per host. Promise.all rejects on the first failure (good results lost). Promise.allSettled → {status, value | reason} for each. Trap: await a(); await b(); await c(); is sequential. Create the promises first, then await them together.", "deep": false}, {"id": "S5E12", "s": 5, "e": 12, "title": "Race conditions", "season": "Data fetching & APIs", "text": "Responses arrive in network order , not request order → an old, slow response can overwrite a newer one. React fix: let ignore = false; … if (!ignore) setX(d); return () => { ignore = true; } . Trap: debounce doesn't fix races (S3E23) — ignore or cancel stale requests; React Query keys data by query.", "deep": false}, {"id": "S5E13", "s": 5, "e": 13, "title": "AbortController", "season": "Data fetching & APIs", "text": "const c = new AbortController(); fetch(url, { signal: c.signal }); c.abort(); → really stops the request. In effects: abort in the cleanup; ignore AbortError (a cancel isn't a failure). AbortSignal.timeout(5000) for timeouts. See it: Network shows aborted requests as (canceled) . Trap: abort doesn't undo a POST already on the server → idempotency key + status check.", "deep": false}, {"id": "S5E14", "s": 5, "e": 14, "title": "Retries + backoff", "season": "Data fetching & APIs", "text": "Exponential backoff: 1 s, 2 s, 4 s, 8 s… capped. Add jitter (random delay) to avoid the thundering herd. Retry network errors, timeouts/408, 429 (after Retry-After), 5xx like 503. Don't retry 400/401/404. React Query: queries retry 3× with min(1000·2^n, 30000) by default; mutations retry 0×. Trap: retry a POST only with an idempotency key.", "deep": false}, {"id": "S5E15", "s": 5, "e": 15, "title": "Deduplication", "season": "Data fetching & APIs", "text": "Several components ask for the same thing → share the in-flight promise (Map of key → promise, delete on settle). React Query dedups by query key. Dedup ≠ cache: dedup shares a request in flight; cache keeps the answer afterwards. Trap: double fetch in dev = React StrictMode (mount → unmount → mount). Production fetches once.", "deep": false}, {"id": "S5E16", "s": 5, "e": 16, "title": "429 Too Many Requests", "season": "Data fetching & APIs", "text": "Rate limits: N requests per user / IP / key per window. Token bucket: each request spends a token; tokens refill steadily. See it: api.github.com headers x-ratelimit-limit: 60 , x-ratelimit-remaining , x-ratelimit-reset (unauthenticated). On 429: read Retry-After and wait. Be a good client: debounce, dedupe, cache. Trap: per-IP limits block whole offices behind one NAT → limit per user / API key.", "deep": false}, {"id": "S5E17", "s": 5, "e": 17, "title": "Skeleton screens", "season": "Data fetching & APIs", "text": "Skeletons show layout before data → feels faster; must match the real layout or you get CLS (S3E04). Don't flash: show only if loading takes > ~200 ms. Skeleton on first load ( isPending ); on refetch keep old data ( isFetching → small spinner). See it: YouTube with Slow 4G. Trap: actions (saving) → spinner on the button; skeletons are for content.", "deep": false}, {"id": "S5E18", "s": 5, "e": 18, "title": "Partial failure", "season": "Data fetching & APIs", "text": "An error thrown during render with no boundary unmounts the whole tree. Wrap each widget in an ErrorBoundary with fallback + retry. Data: Promise.allSettled . Decide what's critical (price → error page) vs optional (recommendations → hide). Trap: boundaries don't catch event-handler or async errors → put the error in state and throw during render, or throwOnError in your data library.", "deep": false}, {"id": "S5E19", "s": 5, "e": 19, "title": "Suspense boundaries", "season": "Data fetching & APIs", "text": "A suspending component shows the nearest <Suspense fallback> until everything inside is ready. Streaming (S2E13) sends the shell then each boundary; selective hydration (S2E11). One boundary = waits for the slowest; one per component = popcorn + jumps. Group: critical first, own boundary for heavy parts, below-the-fold together. Pair each Suspense boundary with an ErrorBoundary. Trap: useEffect fetching never suspends → use use(promise) , a framework loader, or useSuspenseQuery .", "deep": false}, {"id": "S5E20", "s": 5, "e": 20, "title": "IQ: async edge cases", "season": "Data fetching & APIs", "text": "all vs allSettled · search race (abort / ignore stale, debounce, key by query) · POST timeout (idempotency key, status check, backoff + jitter) · one big spinner (split Suspense boundaries, skeletons, streaming).", "deep": false}, {"id": "S5E21", "s": 5, "e": 21, "title": "Finale: one search page", "season": "Data fetching & APIs", "text": "REST + BFF → cursor pagination + infinite scroll → debounce + AbortController (no races) → parallel, no waterfalls → retries/jitter, dedup, Retry-After → matching skeletons, isolated failures, grouped Suspense. Next: Season 6 · Real-time (polling → SSE → WebSockets → CRDTs).", "deep": false}, {"id": "S6E01", "s": 6, "e": 1, "title": "How did it arrive?", "season": "Real-time", "text": "HTTP is request → response: the server can't speak first. \"Real-time\" = the server can push the moment something happens. See it: WhatsApp Web → DevTools → Network → filter WS → click the connection → Messages . ↓ red = received, ↑ green = sent. Five transports: short polling · long polling · Server-Sent Events · WebSockets · WebRTC. Trap: \"real-time means WebSockets\" → no. Pick by who talks and how often (a badge can poll; AI answers stream over SSE).", "deep": false}, {"id": "S6E02", "s": 6, "e": 2, "title": "Short polling", "season": "Real-time", "text": "Ask on a fixed timer (\"anything new?\"). Cost = latency (up to one interval) + load (10,000 tabs ÷ 5 s = 2,000 req/s, mostly empty). Fine for rare updates where seconds of delay are OK: dashboards, build status, unread badges. Works through every proxy. Trap: setInterval(fetch) overlaps when the server slows → schedule the next poll with setTimeout after the response; skip work when document.hidden .", "deep": false}, {"id": "S6E03", "s": 6, "e": 3, "title": "Long polling", "season": "Real-time", "text": "Server holds the request open until there's news (or ~30 s timeout → empty response), client immediately asks again. Near-instant, plain HTTP. Costs: full request + headers per message, one open request per user. Trap: messages in the gap between polls → send a cursor ( ?since=<last id> ) so the server returns everything after it.", "deep": false}, {"id": "S6E04", "s": 6, "e": 4, "title": "Server-Sent Events", "season": "Real-time", "text": "One HTTP response that never ends: Content-Type: text/event-stream . Format: id: , event: , data: lines, blank line ends an event. new EventSource('/stream') → onmessage . Auto-reconnects and sends Last-Event-ID so the server can resume. Limits: one-way (send with normal fetch POST), text only. Trap: HTTP/1.1 ≈ 6 connections per origin; each open stream holds one → 7th tab hangs. HTTP/2 multiplexes streams on one connection.", "deep": false}, {"id": "S6E05", "s": 6, "e": 5, "title": "WebSockets", "season": "Real-time", "text": "Starts as HTTP GET with Upgrade: websocket → 101 Switching Protocols → same TCP connection carries frames both ways. Frame header 2–14 bytes vs hundreds of bytes of HTTP headers. wss:// = over TLS. API: onopen , send , onmessage , onclose . Each message is a task (S1E15) → batch bursts, render once per frame ( requestAnimationFrame ). Trap: WebSockets do not reconnect by themselves. Reconnect, catch up and resend are your job (E10).", "deep": false}, {"id": "S6E06", "s": 6, "e": 6, "title": "WebRTC", "season": "Real-time", "text": "Browser ↔ browser audio, video, data. See it: on a Meet call open chrome://webrtc-internals . Signaling (your choice, usually a WebSocket) swaps offer/answer (SDP) + ICE candidates . STUN = \"what's my public address\", TURN = relay when direct fails. Code: new RTCPeerConnection({ iceServers }) → createDataChannel / addTrack → createOffer → setLocalDescription → send via signaling. Trap: 100-person mesh = 99 uploads each. Big calls use an SFU (Selective Forwarding Unit): upload once, server forwards.", "deep": false}, {"id": "S6E07", "s": 6, "e": 7, "title": "The showdown", "season": "Real-time", "text": "Audio/video/peer data → WebRTC . 2. Client sends often, low latency (chat, games, cursors) → WebSockets . Server pushes, client listens (scores, notifications, AI answers) → SSE . 4. Rare updates / delay OK → polling (long polling if faster). SSE: one-way, built-in reconnect, text, plain HTTP. WS: two-way, binary, DIY reconnect, leaves HTTP after upgrade. Polling: most compatible, most wasteful. Trap: \"chat needs WebSockets\" → not necessarily: SSE down + POST up is valid and stays plain HTTP (caching, auth, load balancing).", "deep": false}, {"id": "S6E08", "s": 6, "e": 8, "title": "IQ: transports", "season": "Real-time", "text": "setInterval poll vs slow server (overlap, out of order → setTimeout after response, backoff, pause when hidden) · 7th SSE tab (HTTP/1.1 6-connection limit → HTTP/2 or share one stream) · million-viewer scores (SSE) · WebRTC offer delivery (no built-in signaling; STUN/TURN).", "deep": false}, {"id": "S6E09", "s": 6, "e": 9, "title": "Heartbeats", "season": "Real-time", "text": "A dead TCP connection doesn't announce itself (sleep, Wi-Fi drop) → half-open connection; app shows \"online\" forever. Proxies also kill idle connections. App-level ping/pong: every message resets a timer; silence > interval + margin (e.g. 35 s for 30 s pings) → ws.close() → reconnect. Browsers answer protocol ping frames silently, and JS can't send them → apps send their own {type:'ping'} . Trap: interval must be under the shortest idle timeout on the path (often 20–30 s), but not so fast it drains batteries.", "deep": false}, {"id": "S6E10", "s": 6, "e": 10, "title": "Reconnect", "season": "Real-time", "text": "See it: WhatsApp Web, Wi-Fi off → \"Computer not connected\" banner; on → missed messages appear. Naive instant reconnect → thundering herd after a server restart. Fix: exponential backoff (1, 2, 4, 8 … cap 30 s) + random jitter (S5E14). On open: resync since=<last seq> , then flush the outbox. Listen to online / offline / visibilitychange . AbortController (S5E13): one abort() removes the old socket's listeners and cancels its catch-up fetch. Trap: don't retry every close. 1000 = normal close; auth failures need re-login, not retries. Retry network errors (1006).", "deep": false}, {"id": "S6E11", "s": 6, "e": 11, "title": "Ordering", "season": "Real-time", "text": "One socket = TCP order. Many paths (devices, reconnects, HTTP + socket) = no order guarantee. Sender clocks lie. Server assigns a sequence number per chat . Client: drop seq <= last , buffer gaps and fetch missing ranges, apply in order. Trap: async onmessage handler that awaits (decrypt) can finish message 2 before 1 → queue and process one at a time.", "deep": false}, {"id": "S6E12", "s": 6, "e": 12, "title": "Acks & dedup", "season": "Real-time", "text": "WhatsApp ticks: 1 grey = server got it, 2 grey = delivered to the device, 2 blue = read. Clock = pending (optimistic UI, S4E15). Lost ack → retry → duplicate. Fix: client-generated id ( crypto.randomUUID() ), outbox until acked, server drops repeat ids, client merges its own echo. Guarantee: at-least-once + dedup ≈ exactly-once. Trap: generate the id on the client : a server id doesn't exist until the first attempt succeeds.", "deep": false}, {"id": "S6E13", "s": 6, "e": 13, "title": "Scaling WebSockets", "season": "Real-time", "text": "Sockets are stateful: Alice on server A, Bob on server B. Fix: pub/sub (Redis, Kafka, NATS): A publishes to user:bob , B is subscribed and pushes down Bob's socket. Keep socket servers dumb, scale out; load balancer must support Upgrade + long idle timeouts. Deploys drop every socket on a server → drain gradually, clients reconnect with jitter. Trap: sticky sessions only route reconnects to the same server; they don't deliver cross-server messages.", "deep": false}, {"id": "S6E14", "s": 6, "e": 14, "title": "Presence", "season": "Real-time", "text": "Online/offline from connections + heartbeats + TTL ( SET presence:riya online EX 60 , renewed by each heartbeat). Count connections, not users (laptop closed, phone open = online). Debounce offline to avoid flapping. Fan-out: only to users currently viewing; throttle \"typing…\" (~1 event / 3 s, auto-expires). Trap: don't store presence in the main database → in-memory store with TTLs.", "deep": false}, {"id": "S6E15", "s": 6, "e": 15, "title": "IQ: staying alive", "season": "Real-time", "text": "Laptop sleeps, \"online\" for hours (half-open → heartbeats + TTL) · restart crash loop (herd → backoff + jitter, drain) · own message twice (lost ack → client UUID, dedup) · cross-server delivery (pub/sub, not sticky sessions).", "deep": false}, {"id": "S6E16", "s": 6, "e": 16, "title": "Edit conflicts", "season": "Real-time", "text": "See it: Google Docs with a friend: coloured named cursors in the same sentence. Whole-document saves = last save wins → lost words. Send operations ( insert 'h' @1 ) instead. Positions shift: \"cat\" + insert h@1 → \"chat\"; concurrent delete @2 applied blindly → \"cht\". Adjusted to delete @3 → \"cha\". Forms: optimistic concurrency → PUT with If-Match: <etag> → 412 = conflict, merge or ask. Trap: locking works and users hate it (forgotten tab blocks everyone). Locks for forms/tickets, not live text.", "deep": false}, {"id": "S6E17", "s": 6, "e": 17, "title": "OT vs CRDT", "season": "Real-time", "text": "OT : central server orders ops and transforms late ones against earlier ones. Lean docs, needs a server. CRDT : every character gets a permanent unique id; inserts reference ids; merges in any order, peer-to-peer and offline. Costs metadata + tombstones. See it: Google Docs offline mode → edit → reconnect → merged. Trap: don't write your own. Use Yjs or Automerge ; spend time on presence, cursors, undo.", "deep": false}, {"id": "S6E18", "s": 6, "e": 18, "title": "IQ: collaboration", "season": "Real-time", "text": "Typing for 200 (throttle ~3 s, viewers only, auto-expire, not in DB) · profile form lost updates (ETag + If-Match → 412 → merge) · \"cat\" puzzle (\"cha\": delete @2 → @3) · offline notes app with no server (CRDT library).", "deep": false}, {"id": "S6E19", "s": 6, "e": 19, "title": "Finale: one chat app", "season": "Real-time", "text": "Transports: WebSocket for chat, SSE for notifications, WebRTC for calls (socket = signaling), polling for the admin dashboard. Send: client UUID + outbox → optimistic bubble → server seq + ack → tick; retries deduped. Survive: heartbeats 25 s → backoff + jitter → resync since last seq → flush outbox. Scale: dumb socket servers + pub/sub; presence with TTL to viewers only; typing throttled. Shared notes: CRDT library. Next: Season 7 · Caching.", "deep": false}], S={"1": "How the browser really works", "2": "Rendering strategies", "3": "Web performance", "4": "State management", "5": "Data fetching & APIs", "6": "Real-time", "7": "Caching", "8": "Offline & PWA", "9": "Security", "10": "Architecture", "11": "Accessibility", "12": "i18n", "13": "Observability", "14": "Testing", "15": "Build & deploy", "16": "Capstone"};
const q=document.getElementById('q'), list=document.getElementById('list'), chips=document.getElementById('chips');
let season=0, sel=0;
const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
D.forEach(d=>d.k=norm(d.title+' '+d.season+' '+d.text));
function parseNum(v){ // "s2e5", "S2 E05", "2 5", "2.5", "2x5", "season 2 episode 5", "s3", "season 3", "e5"
  let m=v.match(/^\s*(?:s(?:eason)?\s*)?(\d{1,2})\s*(?:[ .x:\-\/]+|\s*e(?:p(?:isode)?)?\s*)(\d{1,2})\s*$/i);
  if(m) return {s:+m[1],e:+m[2]};
  m=v.match(/^\s*s(?:eason)?\s*(\d{1,2})\s*$/i); if(m) return {s:+m[1]};
  m=v.match(/^\s*e(?:p(?:isode)?)?\s*(\d{1,2})\s*$/i); if(m) return {e:+m[1]};
  return null;
}
function score(d,words,raw){let sc=0;const t=norm(d.title);
  for(const w of words){if(!d.k.includes(w))return -1; sc+=t.includes(w)?10:1; if(t.startsWith(w))sc+=5;}
  if(t===raw)sc+=50; return sc;}
function render(){
  const v=q.value.trim(), num=parseNum(v); let r=D.filter(d=>!season||d.s===season);
  if(num){r=r.filter(d=>(!num.s||d.s===num.s)&&(!num.e||d.e===num.e));}
  else if(v){const raw=norm(v), w=raw.split(' ').filter(Boolean);
    r=r.map(d=>[score(d,w,raw),d]).filter(x=>x[0]>=0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);}
  sel=0;
  if(!r.length){list.innerHTML='<div class="empty">No episode found. Try <b>s1e5</b>, <b>2 3</b> or a word like <b>cache</b>. (Interview-question episodes have no notes.)</div>';return}
  const grouped=!v; let h='', cur=-1;
  r.forEach((d,i)=>{ if(grouped&&d.s!==cur){if(cur>0)h+='</div>';cur=d.s;h+=`<div class="group"><h2>Season ${d.s} · ${S[d.s]||''}</h2>`}
    let snip=''; if(v&&!num){const w=norm(v).split(' ')[0], j=d.text.toLowerCase().indexOf(w); if(j>=0)snip=d.text.slice(Math.max(0,j-40),j+80);}
    h+=`<a class="item${i===0&&v?' sel':''}" href="${d.id.toLowerCase()}/"><span class="n">S${d.s} · E${String(d.e).padStart(2,'0')}</span><span><span class="t">${esc(d.title)}${d.deep?'<span class="badge">DEEP NOTES</span>':''}</span>${snip?`<span class="snip">…${esc(snip)}…</span>`:''}</span></a>`;});
  if(grouped)h+='</div>'; list.innerHTML=h;
}
chips.innerHTML='<button class="on" data-s="0">All</button>'+Object.keys(S).filter(s=>D.some(d=>d.s==s)).map(s=>`<button data-s="${s}">S${s} · ${S[s]}</button>`).join('');
chips.onclick=e=>{const b=e.target.closest('button');if(!b)return;season=+b.dataset.s;chips.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render()};
q.oninput=()=>{history.replaceState(null,'',q.value?'#q='+encodeURIComponent(q.value):location.pathname);render()};
q.onkeydown=e=>{const items=[...list.querySelectorAll('.item')];
  if(e.key==='Enter'&&items[sel]){location.href=items[sel].href}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(items.length-1,sel+(e.key==='ArrowDown'?1:-1)));
    items.forEach((x,i)=>x.classList.toggle('sel',i===sel));items[sel]&&items[sel].scrollIntoView({block:'nearest'})}};
document.querySelectorAll('.hint code').forEach(c=>c.onclick=()=>{q.value=c.textContent;q.oninput();q.focus()});
const h=new URLSearchParams(location.hash.slice(1)).get('q'); if(h)q.value=h;
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
render();
</script></body></html>
